<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
<defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#33415C"/>
      </marker>
      <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#45D4E8"/><stop offset="1" stop-color="#6C8CFF"/></linearGradient>
    </defs>
<rect width="1500" height="720" rx="32" fill="#0B1020"/>
<text x="70" y="70" fill="#EAF2FF" font-size="34" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Progressive agent protocol</text>
<text x="70" y="108" fill="#A9B7CE" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">A narrow contract instead of dumping an OpenAPI document into the model.</text>

<g>
  <circle cx="140" cy="230" r="42" fill="#182338" stroke="#45D4E8" stroke-width="3"/>
  <text x="140" y="238" text-anchor="middle" fill="#EAF2FF" font-size="24" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif">1</text>
  <text x="140" y="310" text-anchor="middle" fill="#EAF2FF" font-size="20" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Discover</text>
  <text x="140" y="338" text-anchor="middle" fill="#A9B7CE" font-size="14" font-family="monospace">schema</text>

  <circle cx="385" cy="230" r="42" fill="#182338" stroke="#6C8CFF" stroke-width="3"/>
  <text x="385" y="238" text-anchor="middle" fill="#EAF2FF" font-size="24" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif">2</text>
  <text x="385" y="310" text-anchor="middle" fill="#EAF2FF" font-size="20" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Inspect</text>
  <text x="385" y="338" text-anchor="middle" fill="#A9B7CE" font-size="14" font-family="monospace">schema order +create</text>

  <circle cx="630" cy="230" r="42" fill="#182338" stroke="#6EE7B7" stroke-width="3"/>
  <text x="630" y="238" text-anchor="middle" fill="#EAF2FF" font-size="24" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif">3</text>
  <text x="630" y="310" text-anchor="middle" fill="#EAF2FF" font-size="20" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Dry-run</text>
  <text x="630" y="338" text-anchor="middle" fill="#A9B7CE" font-size="14" font-family="monospace">--dry-run</text>

  <circle cx="875" cy="230" r="42" fill="#182338" stroke="#FDBA74" stroke-width="3"/>
  <text x="875" y="238" text-anchor="middle" fill="#EAF2FF" font-size="24" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif">4</text>
  <text x="875" y="310" text-anchor="middle" fill="#EAF2FF" font-size="20" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Confirm</text>
  <text x="875" y="338" text-anchor="middle" fill="#A9B7CE" font-size="14" font-family="monospace">explicit approval</text>

  <circle cx="1120" cy="230" r="42" fill="#182338" stroke="#6C8CFF" stroke-width="3"/>
  <text x="1120" y="238" text-anchor="middle" fill="#EAF2FF" font-size="24" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif">5</text>
  <text x="1120" y="310" text-anchor="middle" fill="#EAF2FF" font-size="20" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Execute</text>
  <text x="1120" y="338" text-anchor="middle" fill="#A9B7CE" font-size="14" font-family="monospace">--yes</text>

  <circle cx="1360" cy="230" r="42" fill="#182338" stroke="#45D4E8" stroke-width="3"/>
  <text x="1360" y="238" text-anchor="middle" fill="#EAF2FF" font-size="24" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif">6</text>
  <text x="1360" y="310" text-anchor="middle" fill="#EAF2FF" font-size="20" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Consume</text>
  <text x="1360" y="338" text-anchor="middle" fill="#A9B7CE" font-size="14" font-family="monospace">UTF-8 JSON</text>
</g>

<path d="M182 230 L343 230" stroke="#33415C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M427 230 L588 230" stroke="#33415C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M672 230 L833 230" stroke="#33415C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M917 230 L1078 230" stroke="#33415C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M1162 230 L1318 230" stroke="#33415C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

<rect x="170" y="470" width="1160" height="135" rx="26" fill="#121A2B" stroke="#33415C" stroke-width="2"/>
<text x="210" y="515" fill="#EAF2FF" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Behind the command</text>
<text x="210" y="553" fill="#A9B7CE" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">Java Shortcut  →  Operation Registry  →  OpenAPI + environment auth  →  Remote API</text>
<text x="210" y="583" fill="#A9B7CE" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">Validation, compensation and partial-success semantics stay in Java — transport mapping stays in Cliflow.</text>
</svg>